name: Android release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: \${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: \${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: \${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build:android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: \${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Configure Android signing secrets before creating a release tag."; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xadrez-local.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/xadrez-local.jks" >> "$GITHUB_ENV"
      - run: gradle -p android :app:assembleRelease :app:lintRelease
      - name: Publish GitHub release
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "Xadrez-Local-\${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "Xadrez-Local-\${GITHUB_REF_NAME}.apk" --generate-notes
