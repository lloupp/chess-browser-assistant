<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jogar contra Stockfish</title><link rel="stylesheet" href="play.css"></head><body><main><header><p class="eyebrow">CHESS BROWSER ASSISTANT</p><h1>Tu contra Stockfish.</h1><p>Um tabuleiro, teu próximo lance. Computador local.</p></header><div class="layout"><section><div id="board" aria-label="Tabuleiro de xadrez"></div></section><aside><label>Tuas peças<select id="color"><option value="w">Brancas</option><option value="b">Pretas</option></select></label><label>Dificuldade<select id="level"><option value="1">Iniciante</option><option value="4" selected>Intermediário</option><option value="10">Avançado</option></select></label><button id="new">Nova partida</button><button id="retry" hidden>Tentar novamente</button><p id="status" role="status" aria-live="polite"></p><p id="last"></p><h2>Lances</h2><ol id="history"></ol><p class="help">Toque na peça e depois no destino. Cor e dificuldade são aplicadas ao iniciar uma nova partida.</p></aside></div><dialog id="promotion"><h2>Promover peão</h2><button data-piece="q">Dama</button><button data-piece="r">Torre</button><button data-piece="b">Bispo</button><button data-piece="n">Cavalo</button></dialog></main><script src="play.js"></script></body></html>
